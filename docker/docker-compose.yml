# Usage
#   Start:              docker compose up -d
#   Stop:               docker compose down
#   Dev mode:           docker compose -f docker-compose.yml -f ./dev/docker-compose.dev.yml up -d
#   Reset everything:   sh reset.sh
#
# HST fork: this file is the deployed stack. `docker compose up -d` (no override
# files) must keep starting only:
#   admin, admin-scheduler, admin-worker, auth, db, imgproxy, kong, meta, realtime, rest, storage
#
# Disabled on purpose (commented, not deleted): studio, envoy (api-gw), functions,
# supavisor. Analytics and vector now live in docker-compose.logs.yml and are not
# enabled. Do not set COMPOSE_FILE to add those overrides on the production host.
#
# Postgres 17 is the image below. Do not start it against the existing Postgres 15
# data directory. Run `sudo bash utils/upgrade-pg17.sh` first, while the current
# PG 15 container is still running. See docker/CHANGELOG.md [0.6.0].
#
# Notes:
#   - Nested variable interpolation (${A:-${B}}) requires podman-compose >= 1.6.0


name: supabase

# Shared environment for the Laravel admin app and its background-worker containers.
# The web container, the scheduler, and the queue worker are the same application and
# must see the same configuration -- an anchor is the only way to guarantee that a var
# added here reaches all three (compose silently interpolates a missing var to empty).
x-admin-env: &admin-env
  APP_DEBUG: false
  APP_ENV: ${ADMIN_APP_ENV:-production}
  APP_KEY: ${ADMIN_APP_KEY}
  APP_URL: ${ADMIN_APP_URL}
  ASSET_URL: ${ADMIN_ASSET_URL:-${ADMIN_APP_URL}}
  AWS_ENVIRONMENT: ${AWS_ENVIRONMENT}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET}
  AWS_TEXTRACT_UPLOADS_BUCKET: ${ADMIN_AWS_TEXTRACT_UPLOADS_BUCKET:-"hst-textract-uploads"}
  AWS_TEXTRACT_ROLE_ARN: ${ADMIN_AWS_TEXTRACT_ROLE_ARN}
  AWS_TEXTRACT_SNS_TOPIC_ARN: ${ADMIN_AWS_TEXTRACT_SNS_TOPIC_ARN}
  AWS_SQS_EMAIL_QUEUE_URL: ${ADMIN_AWS_SQS_EMAIL_QUEUE_URL}
  AWS_SES_EMAIL_BUCKET: ${ADMIN_AWS_SES_EMAIL_BUCKET}
  GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
  HIJACK_EMAIL_ADDRESS: ${HIJACK_EMAIL_ADDRESS}
  PROXY_URL: ${ADMIN_APP_URL}
  PROXY_SCHEMA: https
  DB_CONNECTION: pgsql
  DB_HOST: ${POSTGRES_HOST}
  DB_PORT: ${POSTGRES_PORT}
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${ADMIN_DB_USERNAME}
  DB_PASSWORD: ${ADMIN_POSTGRES_PASSWORD}
  JWT_SECRET: ${JWT_SECRET}
  LOG_CHANNEL: ${ADMIN_LOG_CHANNEL:-stdout}
  LOG_LEVEL: ${ADMIN_LOG_LEVEL:-info}
  SUPABASE_URL: http://kong:8000
  SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
  SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
  TELNYX_API_KEY: ${ADMIN_TELNYX_API_KEY}
  RETELL_API_KEY: ${ADMIN_RETELL_API_KEY}
  BACKGROUND_JOB_PING_MONITOR_URL: ${ADMIN_BACKGROUND_JOB_PING_MONITOR_URL}
  MAIL_MAILER: ${ADMIN_MAIL_MAILER:-ses}
  MAIL_FROM_ADDRESS: ${ADMIN_MAIL_FROM_ADDRESS}
  MAILCHIMP_API_KEY: ${ADMIN_MAILCHIMP_API_KEY}
  MAILCHIMP_NEW_USER_LIST_ID: ${ADMIN_MAILCHIMP_NEW_USER_LIST_ID}
  SENTRY_ENVIRONMENT: ${ADMIN_SENTRY_ENVIRONMENT:-production}
  FIREBASE_CREDENTIALS: ${ADMIN_FIREBASE_CREDENTIALS}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  STRIPE_BASIC_PRICE_ID: ${STRIPE_BASIC_PRICE_ID}
  STRIPE_PREMIUM_PRICE_ID: ${STRIPE_PREMIUM_PRICE_ID}
  STRIPE_TEAM_PRICE_ID: ${STRIPE_TEAM_PRICE_ID}
  STRIPE_TEAM_ANNUAL_PRICE_ID: ${STRIPE_TEAM_ANNUAL_PRICE_ID}
  STRIPE_SOLO_PRICE_ID: ${STRIPE_SOLO_PRICE_ID}
  STRIPE_FAMILY_PRICE_ID: ${STRIPE_FAMILY_PRICE_ID}
  PLAID_CLIENT_ID: ${PLAID_CLIENT_ID}
  PLAID_SECRET: ${PLAID_SECRET}
  PLAID_ENV: ${PLAID_ENV}
  PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL}
  # Must exceed the longest job timeout (ProcessReceiptWithBedrockAgentJob = 600s), or
  # the queue re-reserves a job that is still running and executes it twice.
  DB_QUEUE_RETRY_AFTER: ${ADMIN_DB_QUEUE_RETRY_AFTER:-900}

services:

